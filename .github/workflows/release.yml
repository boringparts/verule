name: Publish npm packages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-publication-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  pack:
    name: Check and pack
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: false
          install: false
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source (light)
        run: pnpm exec node --conditions=source scripts/task-gates.ts check
      - name: Build packages in dependency order
        run: pnpm exec turbo run build
      - name: Pack unpublished versions
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      - name: Wait for packed artifact metadata
        if: steps.pack.outputs.pack-dir-artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pack.outputs.pack-dir-artifact-id }}
        run: |
          for _ in $(seq 1 10); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --silent; then
              exit 0
            fi
            sleep 3
          done
          echo "Packed artifact $ARTIFACT_ID did not become available in GitHub Actions API" >&2
          exit 1
      - name: Download packed artifacts for verification
        if: steps.pack.outputs.pack-dir-artifact-id != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ steps.pack.outputs.pack-dir-artifact-id }}
          path: .changeset/packed
      - name: Verify packed candidates (heavy)
        if: steps.pack.outputs.pack-dir-artifact-id != ''
        env:
          VERULE_ACCEPTANCE_PACK_DIR: ${{ github.workspace }}/.changeset/packed
        run: pnpm exec node --conditions=source scripts/task-gates.ts check:heavy

  publish:
    name: Publish npm packages and GitHub Release
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: false
          install: false
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish packed versions
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
