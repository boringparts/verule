nodeLinker: isolated
preferSymlinkedExecutables: true
shellEmulator: true
autoInstallPeers: false
injectWorkspacePackages: false
dedupeInjectedDeps: false
syncInjectedDepsAfterScripts:
  - build
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
allowBuilds:
  esbuild: true
overrides: {}
packages:
  - apps/*
  - packages/*
  - test/*
  - test/acceptance-host/data
  - test/acceptance-host/app
  - test/acceptance-host/overlays/drizzle/app
  - test/acceptance-host/overlays/drizzle-zod/app
  - test/acceptance-host/overlays/zod/app
  - test/acceptance-host/overlays/*/data
catalog:
  "@changesets/cli": 3.0.3
  "@tssae/adapters": "0.1.0"
  "@types/node": ^26.0.0
  "@verule/rules-reference": "workspace:*"
  "@boringparts/verule": "workspace:*"
  drizzle-zod: 0.8.3
  drizzle-orm: 0.45.3
  "@ykdz/cli-contract": 0.5.0
  oxfmt: ^0.79.0
  oxlint: 1.94.0
  tsrs: 7.1.0-beta.tsrs4
  turbo: 2.11.13
  typescript-7: npm:typescript@^7.0.2
  zod: ^4.6.7
