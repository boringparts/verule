nodeLinker: isolated
preferSymlinkedExecutables: true
shellEmulator: true
autoInstallPeers: false
injectWorkspacePackages: false
dedupeInjectedDeps: false
syncInjectedDepsAfterScripts:
  - build
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "tsrs@7.1.0-beta.tsrs4"
  - "@tsrs/darwin-arm64@7.1.0-beta.tsrs4"
  - "@tsrs/darwin-x64@7.1.0-beta.tsrs4"
  - "@tsrs/linux-arm64-gnu@7.1.0-beta.tsrs4"
  - "@tsrs/linux-arm64-musl@7.1.0-beta.tsrs4"
  - "@tsrs/linux-x64-gnu@7.1.0-beta.tsrs4"
  - "@tsrs/linux-x64-musl@7.1.0-beta.tsrs4"
  - "@tsrs/win32-arm64@7.1.0-beta.tsrs4"
  - "@tsrs/win32-x64@7.1.0-beta.tsrs4"
allowBuilds:
  esbuild: true
overrides: {}
packages:
  - apps/*
  - packages/*
catalog:
  "@types/node": ^26.0.0
  "@ykdz/cli-contract": 0.5.0
  oxfmt: ^0.74.0
  oxlint: ^1.89.0
  oxlint-tsgolint: ^7.0.2001
  turbo: 2.11.10
  typescript-7: npm:typescript@^7.0.2
  zod: ^4.6.7
