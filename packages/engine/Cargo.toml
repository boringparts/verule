[package]
name = "verule-engine"
version = "0.0.0"
edition = "2024"
publish = false

[lints]
workspace = true

[workspace]
members = ["."]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
